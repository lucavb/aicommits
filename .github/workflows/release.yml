name: Release

on:
    push:
        branches:
            - main
            - beta
            - alpha
    workflow_dispatch:

# One release run per ref at a time: parallel runs could double-publish, and
# parallel digest refreshes would fight over the branch tip.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write # to be able to publish a GitHub release
    issues: write # to be able to comment on released issues
    pull-requests: write # to be able to comment on released pull requests
    id-token: write # to enable use of OIDC for npm provenance

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: "!contains(github.event.head_commit.message, 'skip ci')"

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0 # Fetch all history for all tags and branches

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run dependency lifecycle scripts explicitly if needed
              run: npm rebuild

            - name: Build
              run: npm run build

            - name: Verify bundle against committed reference (auto-refresh explained drift, fail closed on unexplained drift)
              run: BUNDLE_REFRESH_PUSH=1 bash scripts/verify-bundle.sh

            - name: Code Quality
              run: npm run cq

            - name: Tests
              run: npm run test

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release
