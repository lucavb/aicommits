name: Test

on:
    push:
        branches: [main, 'renovate/**']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
            cancel-in-progress: true

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # verify-bundle compares the current tree with the commit
                  # that last refreshed the reference digest.
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: npm ci

            - name: Build bundle
              run: npm run build

            - name: Verify bundle digest
              run: bash scripts/verify-bundle.sh

            - name: Code Quality
              run: npm run cq

            - name: Tests
              run: npm run test

            - name: End-to-end tests
              run: npm run test:e2e
